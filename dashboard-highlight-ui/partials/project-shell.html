<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智控数据大屏</title>
    <style id="theme-vars">
/* Dashboard Highlight UI — Brand CSS */
/* High-contrast dark dashboard for medium/large screens */

:root {
  /* Primary brand hue: Amber */
  --brand-primary-50: #FFFBEB;
  --brand-primary-100: #FEF3C7;
  --brand-primary-200: #FDE68A;
  --brand-primary-300: #FCD34D;
  --brand-primary-400: #FBBF24;
  --brand-primary-500: #F59E0B;
  --brand-primary-600: #D97706;
  --brand-primary-700: #B45309;
  --brand-primary-800: #92400E;
  --brand-primary-900: #78350F;

  /* Neutral scale: cool gray */
  --brand-neutral-0: #FFFFFF;
  --brand-neutral-50: #F8FAFC;
  --brand-neutral-100: #F1F5F9;
  --brand-neutral-200: #E2E8F0;
  --brand-neutral-300: #CBD5E1;
  --brand-neutral-400: #94A3B8;
  --brand-neutral-500: #64748B;
  --brand-neutral-600: #475569;
  --brand-neutral-700: #334155;
  --brand-neutral-800: #1E293B;
  --brand-neutral-900: #0F172A;
  --brand-neutral-950: #020617;

  /* Semantic state colors */
  --state-success: #10B981;
  --state-success-bg: rgba(16, 185, 129, 0.12);
  --state-warning: #F59E0B;
  --state-warning-bg: rgba(245, 158, 11, 0.12);
  --state-error: #F43F5E;
  --state-error-bg: rgba(244, 63, 94, 0.12);
  --state-info: #06B6D4;
  --state-info-bg: rgba(6, 182, 212, 0.12);

  /* Radius scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Shadow: minimal, static surfaces use border/depth */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-glow: 0 0 20px rgba(245, 158, 11, 0.15);

  /* Typography */
  --font-title: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", "Consolas", monospace;

  /* Base light tokens (fallback) */
  --brand-background: var(--brand-neutral-50);
  --brand-surface: var(--brand-neutral-0);
  --brand-surface-elevated: var(--brand-neutral-0);
  --brand-border: var(--brand-neutral-200);
  --brand-border-subtle: var(--brand-neutral-100);
  --brand-text-primary: var(--brand-neutral-900);
  --brand-text-secondary: var(--brand-neutral-600);
  --brand-text-tertiary: var(--brand-neutral-400);
  --brand-primary: var(--brand-primary-500);
  --brand-primary-hover: var(--brand-primary-600);
  --brand-primary-text: var(--brand-primary-600);
}

html.dark {
  --brand-background: #0B0F17;
  --brand-surface: #111827;
  --brand-surface-elevated: #151B26;
  --brand-border: #1F2937;
  --brand-border-subtle: #18202B;
  --brand-text-primary: #F8FAFC;
  --brand-text-secondary: #94A3B8;
  --brand-text-tertiary: #64748B;
  --brand-primary: #F59E0B;
  --brand-primary-hover: #FBBF24;
  --brand-primary-text: #FCD34D;
}

/* Typography classes */
.brand-title {
  font-family: var(--font-title);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--brand-text-primary);
}

.brand-body {
  font-family: var(--font-body);
  font-weight: 400;
  color: var(--brand-text-secondary);
}

.brand-mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* Type scale */
.text-display {
  font-size: 2.5rem;
  line-height: 1.1;
  font-weight: 800;
}

.text-headline {
  font-size: 1.5rem;
  line-height: 1.25;
  font-weight: 700;
}

.text-title {
  font-size: 1.125rem;
  line-height: 1.35;
  font-weight: 600;
}

.text-body {
  font-size: 0.875rem;
  line-height: 1.5;
}

.text-caption {
  font-size: 0.75rem;
  line-height: 1.4;
}

.text-kpi {
  font-size: 2rem;
  line-height: 1;
  font-weight: 800;
}

/* Utility helpers */
.brand-surface {
  background-color: var(--brand-surface);
}

.brand-surface-elevated {
  background-color: var(--brand-surface-elevated);
}

.brand-border {
  border: 1px solid var(--brand-border);
}

.brand-primary-text {
  color: var(--brand-primary-text);
}

.brand-primary-bg {
  background-color: var(--brand-primary);
  color: #0B0F17;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-primary: var(--brand-primary);
    --color-border: var(--brand-border);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen">
        <!-- Shared Region: header -->
        <header
            class="fixed top-0 left-0 right-0 h-16 z-50 flex items-center justify-between px-4 lg:px-6 border-b"
            style="background-color: var(--brand-surface-elevated); border-color: var(--brand-border);">
            <!-- Left: system title -->
            <div class="flex items-center gap-3 min-w-0">
                <span
                    class="flex items-center justify-center w-8 h-8 rounded-md shrink-0"
                    style="background-color: var(--brand-primary); color: var(--brand-background);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
                </span>
                <h1 class="text-title brand-title truncate" style="color: var(--brand-text-primary);">智控数据大屏</h1>
            </div>

            <!-- Center: current time/date -->
            <div class="hidden md:flex flex-col items-center justify-center min-w-0 px-4">
                <time class="text-body brand-mono truncate" style="color: var(--brand-text-primary);">2026-08-07 14:32:00</time>
                <span class="text-caption brand-body truncate" style="color: var(--brand-text-tertiary);">星期五</span>
            </div>

            <!-- Right: global filters / user -->
            <div class="flex items-center gap-2 shrink-0">
                <button type="button" class="header-btn hidden sm:inline-flex" aria-label="刷新数据">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path></svg>
                    <span>刷新</span>
                </button>
                <button type="button" class="header-btn" aria-label="打开筛选">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    <span class="hidden sm:inline">筛选</span>
                </button>
                <button type="button" class="header-btn" aria-label="通知">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                </button>
                <div
                    class="w-8 h-8 rounded-full flex items-center justify-center text-caption brand-title shrink-0"
                    style="background-color: var(--brand-border); color: var(--brand-text-primary);"
                    aria-label="用户头像占位">U</div>
            </div>
        </header>

        <!-- Shared Region: sidebar -->
        <aside
            class="fixed top-16 left-0 bottom-0 w-16 z-40 flex flex-col items-center py-4 border-r"
            style="background-color: var(--brand-surface-elevated); border-color: var(--brand-border);">
            <nav class="flex flex-col items-center gap-1 w-full" aria-label="主导航">
                <!-- SLOT: activeNavItem -->
                <a
                    href="./index.html"
                    data-nav-key="dashboard"
                    data-active="true"
                    class="nav-item group"
                    aria-current="page">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
                    <span class="text-caption truncate">总览</span>
                </a>
                <!-- /SLOT: activeNavItem -->

                <a
                    href="#"
                    data-nav-key="monitor"
                    class="nav-item group"
                    style="color: var(--brand-text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>
                    <span class="text-caption truncate">监控</span>
                </a>

                <a
                    href="#"
                    data-nav-key="alerts"
                    class="nav-item group"
                    style="color: var(--brand-text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                    <span class="text-caption truncate">告警</span>
                </a>

                <a
                    href="#"
                    data-nav-key="settings"
                    class="nav-item group"
                    style="color: var(--brand-text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <span class="text-caption truncate">设置</span>
                </a>
            </nav>
        </aside>

        <!-- Shared Region: main-frame -->
        <div
            class="ml-16 mt-16 min-h-[calc(100vh-64px)] flex flex-col"
            style="background-color: var(--brand-background);">
            <!-- Page header with mutable title slot -->
            <section
                class="px-6 py-4 border-b flex items-center justify-between min-h-[64px]"
                style="border-color: var(--brand-border);">
                <div class="min-w-0">
                    <!-- SLOT: pageTitle -->
                    <h2 class="text-headline brand-title truncate" style="color: var(--brand-text-primary);">数据总览</h2>
                    <!-- /SLOT: pageTitle -->
                </div>
                <div class="hidden sm:flex items-center gap-2 text-caption shrink-0" style="color: var(--brand-text-secondary);">
                    <span class="w-2 h-2 rounded-full" style="background-color: var(--state-success);"></span>
                    <span class="truncate">系统正常</span>
                    <span class="mx-1" style="color: var(--brand-border);">|</span>
                    <span class="brand-mono truncate">刷新 14:30:05</span>
                </div>
            </section>

            <!-- PRIVATE-REGION: dashboard-body -->
            <div class="flex-1 p-6">
                <!-- Leaf page dashboard-body will be injected here -->
            </div>
            <!-- /PRIVATE-REGION: dashboard-body -->
        </div>
    </main>

    <style>
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            gap: 4px;
            transition: color 150ms ease, background-color 150ms ease;
        }
        .nav-item:hover {
            color: var(--brand-text-primary) !important;
            background-color: var(--brand-surface);
        }
        [data-nav-key][data-active="true"] {
            color: var(--brand-primary) !important;
            background-color: var(--state-warning-bg);
        }
        .header-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            line-height: 1;
            color: var(--brand-text-secondary);
            background-color: transparent;
            border: 1px solid var(--brand-border);
            transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease;
        }
        .header-btn:hover {
            color: var(--brand-text-primary);
            border-color: var(--brand-text-tertiary);
            background-color: var(--brand-surface);
        }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
